apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: verl-cluster
  namespace: naomi-llmd-rl
spec:
  rayVersion: '2.47.1'

  headGroupSpec:
    rayStartParams:
      num-cpus: "4"
    template:
      spec:
        containers:
        - name: ray-head
          image: ghcr.io/naomieisen/verl:llm-d
          imagePullPolicy: Always
          lifecycle:
            postStart:
              exec:
                command:
                - /bin/bash
                - -c
                - |
                  exec > /tmp/setup_log.txt 2>&1
                  echo "Starting setup..."

                  # veRL and llmd_verl are already installed in the image.
                  # Just prepare data and prefetch the model.
                  mkdir -p /tmp/verl/hf_cache/datasets

                  # Generate training data
                  python3 /opt/verl/examples/data_preprocess/gsm8k.py --local_save_dir /tmp/verl/data/gsm8k

                  # Pre-fetch model weights
                  python3 -c "import transformers; transformers.pipeline('text-generation', model='Qwen/Qwen2.5-0.5B-Instruct')"

                  echo "Setup complete" > /tmp/verl_ready.txt
          env:
          # --- llm-d integration ---
          - name: LLMD_CONTROLLER_URL
            value: "http://rollout-controller.naomi-llmd-rl.svc.cluster.local:8090" # update namespace if needed <service>.<namespace>.svc.cluster.local

          # --- NCCL diagnostics ---
          - name: NCCL_DEBUG
            value: "INFO"

          # --- veRL / Ray settings (keep from working config) ---
          - name: TOKENIZERS_PARALLELISM
            value: "false"
          - name: OMP_NUM_THREADS
            value: "1"
          - name: VLLM_USE_V1
            value: "1"
          - name: RAY_CHEF_MAX_WORKERS
            value: "1"
          - name: VERL_NUM_THREADS
            value: "1"
          - name: RAY_NUM_CPUS_PER_PROCESSER
            value: "1"
          - name: HOME
            value: "/tmp"
          - name: FLASHINFER_WORKSPACE_DIR
            value: "/tmp/flashinfer"
          - name: HF_HOME
            value: "/tmp/verl/hf_cache"
          - name: HF_DATASETS_CACHE
            value: "/tmp/verl/hf_cache/datasets"
          - name: XDG_CACHE_HOME
            value: "/tmp/verl/hf_cache"
          - name: HUGGINGFACE_HUB_CACHE
            value: "/tmp/verl/hf_cache"
          - name: TRITON_CACHE_DIR
            value: "/tmp/triton"
          - name: PYTHONUSERBASE
            value: "/tmp/.local"
          resources:
            limits:
              cpu: "32"
              memory: "96G"
              # No GPU on head — it only runs the driver (fit() loop) and Ray GCS.
              # FSDP training and NCCL broadcast happen on worker pods.
            requests:
              cpu: "24"
              memory: "64G"
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          volumeMounts:
          - mountPath: /dev/shm
            name: dshm
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"

  workerGroupSpecs:
  - groupName: fsdp-workers
    # Workers handle FSDP training only — llm-d handles inference separately.
    # GPU count depends on model size, not on inference load:
    #   0.5B model  → 1 GPU is enough
    #   7B model    → 2-4 GPUs
    #   70B model   → 8-16 GPUs
    replicas: 1
    minReplicas: 1
    maxReplicas: 4
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: ghcr.io/naomieisen/verl:llm-d
          imagePullPolicy: Always
          env:
          # --- llm-d integration ---
          - name: LLMD_CONTROLLER_URL
            value: "http://rollout-controller.naomi-llmd-rl.svc.cluster.local:8090"

          # --- NCCL diagnostics ---
          - name: NCCL_DEBUG
            value: "INFO"

          # --- veRL / Ray settings ---
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: TOKENIZERS_PARALLELISM
            value: "false"
          - name: OMP_NUM_THREADS
            value: "1"
          - name: HOME
            value: "/tmp"
          - name: HF_HOME
            value: "/tmp/verl/hf_cache"
          - name: TRITON_CACHE_DIR
            value: "/tmp/triton"
          - name: PYTHONUSERBASE
            value: "/tmp/.local"
          resources:
            limits:
              cpu: "16"
              memory: "64G"
              nvidia.com/gpu: "1"   # 1 GPU sufficient for 0.5B; increase for larger models
            requests:
              cpu: "8"
              memory: "32G"
              nvidia.com/gpu: "1"
          volumeMounts:
          - mountPath: /dev/shm
            name: dshm
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"