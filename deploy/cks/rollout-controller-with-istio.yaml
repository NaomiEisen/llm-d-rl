# Rollout Controller deployment that uses existing llm-d Istio infrastructure
# 
# Prerequisites:
# - llm-d stack already deployed (Istio gateway, EPP, vLLM engines)
# - Deploy this in the same namespace as llm-d
#
# Usage:
#   kubectl apply -f rollout-controller-with-istio.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-controller
  namespace: naomi-llmd-rl
  labels:
    app: rollout-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollout-controller
  template:
    metadata:
      labels:
        app: rollout-controller
    spec:
      serviceAccountName: default
      containers:
      - name: controller
        image: ghcr.io/llm-d/llm-d-rl:latest  # Update with your image
        imagePullPolicy: Always
        args:
        - --port=8090
        # Direct engine access for weight management (NCCL)
        - --engines=
        # Use existing Istio gateway for generation requests
        - --use-envoy
        - --envoy-url=http://infra-kv-events-inference-gateway-istio:80
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: rollout-controller
  namespace: llm-d-precise  # Change to your llm-d namespace
  labels:
    app: rollout-controller
spec:
  type: ClusterIP
  selector:
    app: rollout-controller
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    protocol: TCP

