apiVersion: v1
kind: Service
metadata:
  name: vllm-engine
  namespace: naomi-llmd-rl
spec:
  clusterIP: None
  selector:
    app: vllm-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-engine
  namespace: naomi-llmd-rl
spec:
  serviceName: vllm-engine
  replicas: 2
  selector:
    matchLabels:
      app: vllm-engine
  template:
    metadata:
      labels:
        app: vllm-engine
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - vllm
            - serve
          args:
            - Qwen/Qwen3-0.6B
            - --port
            - "8000"
            - --served-model-name
            - Qwen/Qwen3-0.6B
            - --gpu-memory-utilization=0.85
            - --max-model-len=2048
            - --disable-uvicorn-access-log
            - --weight-transfer-config
            - '{"backend":"nccl"}'
          env:
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            - name: HF_HOME
              value: /model-cache
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: TRITON_CACHE_DIR
              value: /.triton-cache
          ports:
            - containerPort: 8000
              name: vllm
              protocol: TCP
          volumeMounts:
            - mountPath: /.config
              name: metrics-volume
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton-cache
              name: triton-cache
            - mountPath: /model-cache
              name: model-storage
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "32Gi"
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: "32Gi"
              cpu: "4"
          startupProbe:
            httpGet:
              path: /v1/models
              port: vllm
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: vllm
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: vllm
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: metrics-volume
          emptyDir: {}
        - name: torch-compile-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: triton-cache
          emptyDir: {}
        - name: model-storage
          emptyDir:
            sizeLimit: 40Gi
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

